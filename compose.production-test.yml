services:
  postgres:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_DB: shortsengine_test
      POSTGRES_USER: shortsengine
      POSTGRES_PASSWORD: local-integration-only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortsengine -d shortsengine_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shortsengine-test
      MINIO_ROOT_PASSWORD: local-integration-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /data
