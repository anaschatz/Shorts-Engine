services:
  postgres:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_DB: shortsengine_test
      POSTGRES_USER: shortsengine
      POSTGRES_PASSWORD: local-integration-only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortsengine -d shortsengine_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shortsengine-test
      MINIO_ROOT_PASSWORD: local-integration-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /data
