name: Python stabilization

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  python-tests:
    name: Python isolation and HookGate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Credential scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-local-video.txt
            requirements-dev.txt

      - name: Install FFmpeg tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Isolated test modules
        run: python scripts/run_python_tests_isolated.py

      - name: HookGate offline evaluation
        run: python research/eval.py

      - name: Lightweight offline imports
        run: |
          python -c "import sys; import research.runner; assert 'research.live_eval' not in sys.modules"
          python -c "import sys; import research.eval; assert 'cv2' not in sys.modules; assert 'numpy' not in sys.modules"
