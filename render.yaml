      - key: MATCHCUTS_PERSISTENCE_ADAPTER
        value: postgres
      - key: MATCHCUTS_QUEUE_ADAPTER
        value: postgres
      - key: MATCHCUTS_STORAGE_ADAPTER
        value: r2
      - key: SHORTSENGINE_AUTH_MODE
        value: oidc
      - key: SHORTSENGINE_TELEMETRY_ADAPTER
        value: postgres
      - key: MATCHCUTS_POSTGRES_SSL_MODE
        value: require
      - key: DATABASE_URL
        fromDatabase:
